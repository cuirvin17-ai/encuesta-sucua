services:
  - type: web
    name: encuesta-sucua
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server-render.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: encuesta-db
          property: connectionString
    healthCheckPath: /health

databases:
  - name: encuesta-db
    plan: free
    databaseName: encuesta_sucua
